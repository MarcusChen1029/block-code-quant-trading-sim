<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quant Sim</title>
  </head>
  <body>
    <header id="topbar"></header>
    <section id="live" class="live-panel" aria-label="Live paper trading"></section>
    <nav id="pane-switch" class="pane-switch"></nav>
    <div id="layout">
      <section id="left" class="pane">
        <div id="left-tabs" class="tabs"></div>
        <div id="blockly"></div>
        <ul id="problems" class="problems" hidden></ul>
        <div id="pine" class="pine-pane"></div>
      </section>
      <div id="splitter" class="splitter"></div>
      <main id="main" class="pane">
        <div id="chart"></div>
        <div id="verdict" class="verdict" hidden></div>
        <section id="stats"></section>
      </main>
    </div>
    <footer id="status">Loading…</footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
